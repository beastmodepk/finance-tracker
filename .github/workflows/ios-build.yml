name: iOS Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build FinanceTracker (unsigned)
    runs-on: macos-26
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild -list -project FinanceTracker/FinanceTracker.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FinanceTracker/FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::$esc"
          done
          echo "----- last 40 lines of build log -----"
          tail -40 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
